<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; min-height: 100vh; display: flex; justify-content: center; align-items: center; }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      width: 100vw;
    }
    .cell {
      position: relative;
      overflow: hidden;
      background: #111;
      aspect-ratio: 16 / 9;
    }
    .cell video-stream {
      display: block;
      width: 100%;
      height: 100%;
    }
    .cell video-stream video {
      width: 100% !important;
      height: 100% !important;
      object-fit: fill !important;
    }
    .label {
      position: absolute;
      top: 8px;
      left: 8px;
      color: #fff;
      font: bold 13px sans-serif;
      text-shadow: 0 0 4px #000;
      z-index: 2;
    }

    @media (max-width: 1024px) {
      .grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 600px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="grid" id="grid"></div>
  <script type="module" src="video-stream.js"></script>
  <script type="module">
    const cams = ['cam1', 'cam2', 'cam3', 'cam4', 'cam5'];
    const grid = document.getElementById('grid');

    cams.forEach(cam => {
      const cell = document.createElement('div');
      cell.className = 'cell';

      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = cam.toUpperCase();

      const player = document.createElement('video-stream');
      player.background = true;
      player.src = new URL('api/ws?src=' + cam, location.href);

      cell.appendChild(label);
      cell.appendChild(player);
      grid.appendChild(cell);
    });
  </script>
</body>
</html>
