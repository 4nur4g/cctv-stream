<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Camera Dashboard</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { background: #000; height: 100%; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 400px), 1fr));
      gap: 2px;
      width: 100%;
      min-height: 100%;
      align-content: center;
    }
    .cell {
      position: relative;
      overflow: hidden;
      background: #111;
      aspect-ratio: 16 / 9;
    }
    .cell video-rtc {
      display: block;
      width: 100%;
      height: 100%;
    }
    .cell video-rtc video {
      width: 100% !important;
      height: 100% !important;
      object-fit: fill !important;
    }
    .cell video-rtc video::-webkit-media-controls {
      display: none !important;
    }

    /* Overlay */
    .overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #111;
      z-index: 3;
      transition: opacity 0.5s ease;
    }
    .overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* Pulse dot indicator */
    .indicator {
      position: relative;
      width: 12px;
      height: 12px;
    }
    .indicator .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255,255,255,0.5);
      position: absolute;
    }
    .indicator .ring {
      position: absolute;
      inset: -6px;
      border: 1.5px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      animation: pulse-ring 1.8s ease-out infinite;
    }
    @keyframes pulse-ring {
      0% { transform: scale(0.5); opacity: 1; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    /* Error state */
    .overlay.error .dot { background: rgba(255,70,70,0.7); }
    .overlay.error .ring { border-color: rgba(255,70,70,0.3); animation: none; opacity: 0.5; transform: scale(1); }

    /* Reconnecting state */
    .overlay.reconnecting .dot { background: rgba(255,180,50,0.7); }
    .overlay.reconnecting .ring { border-color: rgba(255,180,50,0.3); }
  </style>
</head>
<body>
  <div class="grid" id="grid"></div>
  <script type="module">
    import {VideoRTC} from './video-rtc.js';

    class DashboardRTC extends VideoRTC {
      oninit() {
        super.oninit();

        this.overlay = document.createElement('div');
        this.overlay.className = 'overlay';
        this.overlay.innerHTML = '<div class="indicator"><div class="dot"></div><div class="ring"></div></div>';
        this.parentElement.appendChild(this.overlay);

        this.video.addEventListener('playing', () => {
          this.overlay.classList.add('hidden');
        });

        this.video.addEventListener('error', () => {
          this.setOverlay('error');
        });
      }

      onclose() {
        const result = super.onclose();
        if (result) {
          this.setOverlay('reconnecting');
        } else {
          this.setOverlay('error');
        }
        return result;
      }

      setOverlay(state) {
        if (!this.overlay) return;
        this.overlay.className = 'overlay ' + state;
      }
    }

    customElements.define('video-rtc', DashboardRTC);

    const cams = ['cam1', 'cam2', 'cam3', 'cam4', 'cam5'];
    const grid = document.getElementById('grid');

    cams.forEach(cam => {
      const cell = document.createElement('div');
      cell.className = 'cell';

      const player = document.createElement('video-rtc');
      player.background = true;
      player.mode = 'webrtc,mse';
      player.src = new URL('api/ws?src=' + cam, location.href);

      cell.appendChild(player);
      grid.appendChild(cell);
    });
  </script>
</body>
</html>
